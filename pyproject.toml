[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iia-benchmark"
version = "0.1.0"
description = "Benchmark framework for intelligent industrial alarm systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "sktime>=0.30"]
deep = ["scikit-learn>=1.4", "torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
iia-benchmark = "iia_benchmark.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
